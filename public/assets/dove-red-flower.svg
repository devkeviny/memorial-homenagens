<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0A0E17" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7B20" />
    </linearGradient>
    <linearGradient id="redFlowerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bgGrad)" rx="32" />

  <!-- Outer Elegant Border -->
  <rect x="32" y="32" width="448" height="448" rx="24" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6" />
  <rect x="42" y="42" width="428" height="428" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.3" />

  <!-- Dove Silhouette with Wings Extended -->
  <g filter="url(#glow)">
    <!-- Body & Head -->
    <path d="M256 120 C240 120 220 135 210 155 C195 145 170 145 155 160 C140 175 145 200 160 215 C150 225 140 240 140 260 C140 290 170 320 210 340 C230 350 245 355 256 360 C267 355 282 350 302 340 C342 320 372 290 372 260 C372 240 362 225 352 215 C367 200 372 175 357 160 C342 145 317 145 302 155 C292 135 272 120 256 120 Z" fill="url(#goldGrad)" opacity="0.95" />
    
    <!-- Left Wing -->
    <path d="M210 185 C170 170 100 190 70 230 C45 265 60 310 90 320 C120 330 165 290 200 255 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Right Wing -->
    <path d="M302 185 C342 170 412 190 442 230 C467 265 452 310 422 320 C392 330 347 290 312 255 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Tail -->
    <path d="M236 345 C236 380 246 410 256 425 C266 410 276 380 276 345 Z" fill="url(#goldGrad)" opacity="0.85" />
  </g>

  <!-- Red Memorial Flower (Poppy / Rose symbol held in beak) -->
  <g transform="translate(256, 310)" filter="url(#glow)">
    <!-- Stem / Leaf -->
    <path d="M0 10 C-10 25 -30 35 -45 30 C-30 45 -10 45 0 30 Z" fill="#059669" />
    
    <!-- Petals -->
    <circle cx="0" cy="-12" r="14" fill="url(#redFlowerGrad)" />
    <circle cx="-12" cy="0" r="14" fill="url(#redFlowerGrad)" />
    <circle cx="12" cy="0" r="14" fill="url(#redFlowerGrad)" />
    <circle cx="0" cy="12" r="14" fill="url(#redFlowerGrad)" />
    <circle cx="-8" cy="-8" r="12" fill="#EF4444" />
    <circle cx="8" cy="-8" r="12" fill="#EF4444" />
    
    <!-- Flower Center -->
    <circle cx="0" cy="0" r="8" fill="#F59E0B" />
    <circle cx="0" cy="0" r="4" fill="#B45309" />
  </g>
</svg>
