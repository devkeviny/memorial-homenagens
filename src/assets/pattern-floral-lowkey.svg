<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="goldSubtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9A7B20" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Dark Background Base -->
  <rect width="200" height="200" fill="#0A0E17" />

  <!-- Low-Key Floral / Vine Pattern Tile -->
  <g stroke="url(#goldSubtle)" stroke-width="1" fill="none" opacity="0.65">
    <!-- Center Elegant Flourish / Lotus Motif -->
    <path d="M100 100 C100 70 130 50 160 50 C130 50 110 30 100 0 C90 30 70 50 40 50 C70 50 100 70 100 100 Z" fill="url(#goldSubtle)" fill-opacity="0.15" />
    
    <!-- Curved Vine Tendrils -->
    <path d="M0 100 C50 100 80 130 100 180 C120 130 150 100 200 100" />
    <path d="M100 0 C100 50 130 80 180 100 C130 120 100 150 100 200" />

    <!-- Delicate Corner Leaves / Blossoms -->
    <circle cx="100" cy="100" r="16" stroke-opacity="0.4" />
    <circle cx="100" cy="100" r="6" stroke-opacity="0.6" fill="#D4AF37" fill-opacity="0.1" />

    <!-- Small decorative dots -->
    <circle cx="50" cy="50" r="2" fill="#D4AF37" fill-opacity="0.3" stroke="none" />
    <circle cx="150" cy="50" r="2" fill="#D4AF37" fill-opacity="0.3" stroke="none" />
    <circle cx="50" cy="150" r="2" fill="#D4AF37" fill-opacity="0.3" stroke="none" />
    <circle cx="150" cy="150" r="2" fill="#D4AF37" fill-opacity="0.3" stroke="none" />
  </g>
</svg>
