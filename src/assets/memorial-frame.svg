<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="frameGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#0A0E17" stop-opacity="0" />
      <stop offset="100%" stop-color="#0A0E17" stop-opacity="0.85" />
    </radialGradient>
  </defs>

  <!-- Outer Ornate Circular Memorial Frame -->
  <g transform="translate(200, 200)">
    <!-- Outer Glow & Shadow Ring -->
    <circle cx="0" cy="0" r="184" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.3" />
    
    <!-- Primary Gold Beveled Ring -->
    <circle cx="0" cy="0" r="176" fill="none" stroke="url(#frameGold)" stroke-width="8" />
    
    <!-- Inner Fine Gold Ring -->
    <circle cx="0" cy="0" r="166" fill="none" stroke="url(#frameGold)" stroke-width="2" stroke-opacity="0.8" />
    <circle cx="0" cy="0" r="160" fill="none" stroke="#0A0E17" stroke-width="4" />

    <!-- Corner/Cardinal Ornaments (Cross/Leaf motifs at 0, 90, 180, 270 deg) -->
    <!-- Top Ornament -->
    <g transform="translate(0, -176)">
      <path d="M0 -12 L6 0 L0 12 L-6 0 Z" fill="#F3E5AB" />
      <circle cx="0" cy="0" r="3" fill="#D4AF37" />
    </g>
    <!-- Bottom Ornament -->
    <g transform="translate(0, 176)">
      <path d="M0 -12 L6 0 L0 12 L-6 0 Z" fill="#F3E5AB" />
      <circle cx="0" cy="0" r="3" fill="#D4AF37" />
    </g>
    <!-- Left Ornament -->
    <g transform="translate(-176, 0)">
      <path d="M-12 0 L0 -6 L12 0 L0 6 Z" fill="#F3E5AB" />
      <circle cx="0" cy="0" r="3" fill="#D4AF37" />
    </g>
    <!-- Right Ornament -->
    <g transform="translate(176, 0)">
      <path d="M-12 0 L0 -6 L12 0 L0 6 Z" fill="#F3E5AB" />
      <circle cx="0" cy="0" r="3" fill="#D4AF37" />
    </g>
  </g>
</svg>
